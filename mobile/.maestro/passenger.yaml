# Drives the app the way a person would, so the App Store screenshots show real
# screens instead of the login form. Role: пассажир.
appId: com.zhetysu.go
---
- launchApp:
    clearState: true
- tapOn:
    id: "login-phone"
# One digit per command. Sent as a single burst the field lost characters — it
# reformats on every keystroke, and the state update cannot keep up. A command
# each puts a round trip between them, which is enough.
- inputText: "7"
- inputText: "0"
- inputText: "0"
- inputText: "0"
- inputText: "0"
- inputText: "0"
- inputText: "0"
- inputText: "0"
- inputText: "0"
- inputText: "1"
# Cheap insurance: a wrong number fails here, with the number on screen, instead
# of a minute later on a login that could not have worked.
- assertVisible: "+7 700 000 00 01"
- tapOn:
    id: "login-password"
- inputText: ${REVIEW_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit"
# The heading goes only when navigation actually leaves the screen. The button is
# no use to wait on: it disables itself while the request is in flight, and a
# disabled element already reads as not visible.
- extendedWaitUntil:
    notVisible: "Вход в аккаунт"
    timeout: 60000
# Permission sheets are the one thing a screenshot must never catch.
- tapOn:
    text: "Allow.*|Разрешить.*|OK"
    optional: true
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: shots/10-passenger-home
