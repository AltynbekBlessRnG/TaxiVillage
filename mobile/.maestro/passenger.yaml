# Drives the app the way a person would, so the App Store screenshots show real
# screens instead of the login form. The phone is typed as ten national digits
# because the field re-formats on every keystroke and re-absorbs a leading +7.
appId: com.zhetysu.go
env:
  PHONE: "7000000001"
---
- launchApp:
    clearState: true
- tapOn:
    id: "login-phone"
- inputText: ${PHONE}
- tapOn:
    id: "login-password"
- inputText: ${REVIEW_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit"
# The form is gone once the reset navigation lands on the passenger stack.
- extendedWaitUntil:
    notVisible:
      id: "login-submit"
    timeout: 40000
# Permission sheets are the one thing a screenshot must never catch.
- tapOn:
    text: "Allow.*|Разрешить.*|OK"
    optional: true
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: shots/10-passenger-home
