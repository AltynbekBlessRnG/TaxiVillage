# Drives the app the way a person would, so the App Store screenshots show real
# screens instead of the login form. Role: пассажир.
appId: com.zhetysu.go
---
- launchApp:
    clearState: true
- tapOn:
    id: "login-phone"
- inputText: "7000000001"
# The field reformats on every keystroke. A doubled one used to leave a phantom
# digit, and the login then failed for a reason no screenshot could show — so
# check the number before spending forty seconds waiting on the wrong one.
- assertVisible: "+7 700 000 00 01"
- tapOn:
    id: "login-password"
- inputText: ${REVIEW_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit"
# Wait on the heading, not the button: while the request is in flight the
# button is disabled, and a disabled element already reads as not visible — so
# waiting on it returned the moment the tap landed, mid-login. The heading goes
# only when navigation actually leaves the screen. Sixty seconds because the
# backend sleeps between requests and the first one wakes it.
- extendedWaitUntil:
    notVisible: "Вход в аккаунт"
    timeout: 60000
# Permission sheets are the one thing a screenshot must never catch.
- tapOn:
    text: "Allow.*|Разрешить.*|OK"
    optional: true
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: shots/10-passenger-home
