# Drives the app the way a person would, so the App Store screenshots show real
# screens instead of the login form.
appId: com.zhetysu.go
---
- launchApp:
    clearState: true
- tapOn:
    id: "login-phone"
# The number is put on the clipboard by the workflow, one flow at a time.
- pasteText
- tapOn:
    id: "login-password"
- inputText: ${REVIEW_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit"
# The form is gone once the reset navigation lands on the passenger stack.
- extendedWaitUntil:
    notVisible:
      id: "login-submit"
    timeout: 40000
# Permission sheets are the one thing a screenshot must never catch.
- tapOn:
    text: "Allow.*|Разрешить.*|OK"
    optional: true
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: shots/10-passenger-home
