# TaxiVillage — Render Blueprint (Hobby workspace + paid instances ~$23/mo).
# Fresh deploy: delete old Blueprint in Dashboard → New Blueprint → this repo, branch main.
services:
  - type: web
    name: taxivillage-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /api/health/ready
    disk:
      name: taxivillage-uploads
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: taxivillage-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: taxivillage-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: https://taxivillage-backend-14gq.onrender.com
      - key: APP_ORIGIN
        value: https://taxivillage-admin-eul9.onrender.com
      - key: UPLOAD_DIR
        value: /opt/render/project/src/backend/uploads
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0"
      - key: OTP_TTL_MINUTES
        value: "10"
      - key: OTP_RESEND_SECONDS
        value: "45"
      # App Review sign-in, for the demo accounts Apple's reviewer is given.
      # Pinned to a literal here, so every deploy rewrites whatever the
      # dashboard holds: left at "false" it turned each redeploy into a silent
      # lockout, and `reviewLogin` answers a disabled flag with the same
      # "Invalid credentials" as a wrong password, so nothing said why.
      - key: APP_REVIEW_LOGIN_ENABLED
        value: "true"
      # Not a secret: the same three numbers ship inside the app as
      # EXPO_PUBLIC_APP_REVIEW_PHONES, which is what routes them to
      # /auth/review-login. Kept here rather than sync:false so the two lists
      # cannot drift apart, and so a blank dashboard field can't disable
      # sign-in on its own.
      - key: APP_REVIEW_PHONES
        value: "+77000000001,+77000000002,+77000000003"
      - key: APP_REVIEW_PASSWORD
        sync: false
      - key: APP_REVIEW_PASSENGER_PHONE
        sync: false
      - key: APP_REVIEW_DRIVER_PHONE
        sync: false
      - key: APP_REVIEW_MERCHANT_PHONE
        sync: false

  - type: keyvalue
    name: taxivillage-redis
    plan: starter
    ipAllowList:
      - source: 0.0.0.0/0
        description: all
    maxmemoryPolicy: noeviction

  - type: web
    name: taxivillage-admin
    runtime: static
    rootDir: admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://taxivillage-backend-14gq.onrender.com/api

  - type: web
    name: taxivillage-docs
    runtime: static
    rootDir: docs
    buildCommand: "true"
    staticPublishPath: .

databases:
  - name: taxivillage-db
    plan: basic-256mb
    databaseName: taxivillage
