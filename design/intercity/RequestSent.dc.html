<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
    a { color: #38BDF8; } a:hover { color: #7DD3FC; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #09090B; box-sizing: border-box; padding: 12px 20px 0 20px; display: flex; flex-direction: column; overflow: hidden;">

  <div style="margin-bottom: 20px;">
    <div style="display: flex; justify-content: flex-end; margin-bottom: 14px;">
      <div style="width: 48px; height: 48px; border-radius: 24px; background: #18181B; border: 1px solid #27272A; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F4F4F5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </div>
    </div>
    <div style="color: #F4F4F5; font-size: 28px; line-height: 34px; font-weight: 900;">Ищем водителя</div>
    <div style="height: 1px; background: #18181B; margin-top: 18px;"></div>
  </div>

  <div style="background: #0F172A; border: 1px solid #38BDF8; border-radius: 22px; padding: 22px; text-align: center; margin-bottom: 16px;">
    <div style="width: 72px; height: 72px; border-radius: 36px; background: #09090B; border: 2px solid #38BDF8; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto;">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#7DD3FC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
    </div>
    <div style="color: #F4F4F5; font-size: 21px; font-weight: 900; margin-bottom: 10px;">Водители видят вашу заявку</div>
    <div style="color: #DBF0FF; font-size: 16px; line-height: 23px; text-wrap: pretty;">Как только кто-то согласится ехать, мы позвоним и пришлём уведомление.</div>
  </div>

  <div style="background: #16161A; border: 1px solid #27272A; border-radius: 22px; padding: 18px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <span style="color: #A1A1AA; font-size: 15px;">Куда</span>
      <span style="color: #F4F4F5; font-size: 17px; font-weight: 800;">Ушарал → Алматы</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <span style="color: #A1A1AA; font-size: 15px;">Когда</span>
      <span style="color: #F4F4F5; font-size: 17px; font-weight: 800;">10 сент, 08:00</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <span style="color: #A1A1AA; font-size: 15px;">Мест</span>
      <span style="color: #F4F4F5; font-size: 17px; font-weight: 800;">2</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <span style="color: #A1A1AA; font-size: 15px;">Ваша цена</span>
      <span style="color: #F4F4F5; font-size: 17px; font-weight: 800;">18 000 ₸ за место</span>
    </div>
  </div>

  <div style="background: #16161A; border: 1px solid #27272A; border-radius: 22px; padding: 18px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; gap: 14px;">
    <div>
      <div style="color: #F4F4F5; font-size: 17px; font-weight: 800; margin-bottom: 4px;">А пока — 3 машины уже едут</div>
      <div style="color: #A1A1AA; font-size: 14px;">от 16 000 ₸</div>
    </div>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7DD3FC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
  </div>

  <div style="min-height: 56px; border-radius: 18px; border: 1px solid #7F1D1D; background: #2B1114; display: flex; align-items: center; justify-content: center;">
    <span style="color: #FCA5A5; font-size: 16px; font-weight: 800;">Отменить заявку</span>
  </div>

</div>
</x-dc>
</body>
</html>
